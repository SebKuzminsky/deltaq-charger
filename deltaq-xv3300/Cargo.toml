[package]
name = "deltaq-xv3300"
version = "0.1.0"
edition = "2024"

[features]
default = [ "std" ]
std = []

[lib]
path = "src/lib.rs"

[build-dependencies]
anyhow = "1.0"
dbc-codegen = { git = "https://github.com/oxibus/dbc-codegen.git" }
eds-codegen = { git = "https://codeberg.org/SebKuzminsky/eds-codegen.git", version = "0.1.0", features = ["zencan"] }

[dependencies]
bitvec = "1.0.1"
embedded-can = "0.4.1"
tokio-socketcan = "0.3.1"

# the latest released version, 0.0.4, does not correctly export all the types we need
zencan-client = { git = "https://github.com/mcbridejc/zencan.git", branch = "main", features = ["socketcan"] }
