[package]
name = "deltaq-xv3300"
version = "0.1.0"
edition = "2024"

[features]
default = [ "std" ]
std = []

[lib]
path = "src/lib.rs"

[build-dependencies]
anyhow = "1.0"
dbc-codegen = { git = "https://github.com/oxibus/dbc-codegen.git" }
eds-codegen = { git = "https://codeberg.org/SebKuzminsky/eds-codegen.git", version = "0.1.0", features = ["zencan"] }

[dependencies]
bitvec = "1.0.1"
embedded-can = "0.4.1"
tokio-socketcan = "0.3.1"

# version 0.0.4 does not correctly export all the types we need
# version 0.0.5 has breaking API changes that i don't want to deal with yet
zencan-client = { git = "https://github.com/mcbridejc/zencan.git", rev="c8eb8f44548cd5515496fa0e385083a839674c14", features = ["socketcan"] }
